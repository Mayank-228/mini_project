<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="50%" stop-color="#13141f" />
      <stop offset="100%" stop-color="#0a0b12" />
    </linearGradient>

    <!-- Roof Gradient (Hot Pink / Magenta to Vivid Purple) -->
    <linearGradient id="roofGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Ribbon / Core S-shape Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bgGrad)" stroke="#383b4d" stroke-width="2.5" />

  <!-- Inner Ambient Neon Accent -->
  <circle cx="50" cy="50" r="32" fill="#8b5cf6" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Neon Roof Chevron / Gable -->
  <path d="M 28 44 L 50 25 L 72 44" fill="none" stroke="url(#roofGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Vibrant Ribbon / 'S' Loop Motif in Center -->
  <path d="M 40 46 C 40 40, 60 40, 60 49 C 60 56, 40 55, 40 64 C 40 73, 60 73, 60 67" fill="none" stroke="url(#roofGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner High-Velocity Accent Core -->
  <circle cx="50" cy="55" r="3" fill="#ffffff" opacity="0.9" />
</svg>
